<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成长教育学单词</title>
  <style>
    :root{--bg:#f7f4ee;--card:#fffdf9;--line:#ddd5c7;--text:#2f2a24;--muted:#6b6257;--ok:#2f855a;--bad:#c05648;--pri:#5a67d8;--warn:#d69e2e}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(120deg,#f7f4ee,#efe7dc);color:var(--text);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5}
    .wrap{max-width:980px;margin:12px auto;padding:0 12px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 8px 18px rgba(90,80,60,.08)}
    h1,h2{margin:0 0 6px} h1{font-size:26px;letter-spacing:.3px} h2{font-size:19px;text-align:left;padding-left:2px}
    .muted{color:var(--muted)}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .header-card{text-align:center;padding:16px 14px;position:relative;margin:0 auto 10px}
    .back-home{position:absolute;left:14px;top:14px;display:inline-flex;align-items:center;justify-content:center;padding:6px 10px;border:1px solid #d8cfc1;border-radius:8px;background:#fffaf3;color:#2f2a24;text-decoration:none;font-size:13px;font-weight:600}
    .settings-card{padding:10px 12px;margin:0 auto}
    .course-bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:nowrap}
    .course-bar select{flex:1;min-width:0;max-width:220px;height:42px;font-size:15px}
    .focus-col{width:min(1013px, calc(100vw - 24px));margin:0 auto}
    .header-card,.settings-card,#gameCard{width:100%;max-width:none;margin-left:0;margin-right:0}
    .test-hint{text-align:center;font-size:13px;margin-top:6px}
    .settings-form{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px;align-items:center}
    input,select,textarea{background:#fffaf3;color:var(--text);border:1px solid #d8cfc1;border-radius:9px;padding:8px;min-width:0}
    input,select{height:38px;width:100%}
    textarea{width:100%;min-height:120px}
    button{border:1px solid transparent;border-radius:9px;padding:8px 12px;color:#fff;font-weight:700;cursor:pointer;transition:all .18s ease}
    .pri{background:#7b6ed6;border-color:#6f63c9}
    .pri:hover{background:#6f63c9}
    .ok{background:#4a8f72;border-color:#3f7f64}
    .ok:hover{background:#3f7f64}
    .warn{background:#d3a85d;color:#2f2a24;border-color:#c2974b}
    .warn:hover{background:#c2974b}
    .ghost{background:#f1e8da;color:#51463a;border-color:#d8cfc1}
    .ghost:hover{background:#e8dcc9}
    .q{font-size:24px;line-height:1.4;margin:10px 0}
    .opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .opt{padding:10px;border:1px solid #d8cfc1;border-radius:10px;cursor:pointer;background:#fffaf3}
    .opt:hover{border-color:#7b6ed6}
    .fb{min-height:24px;font-weight:700;margin-top:6px}.good{color:#2f855a}.bad{color:#c05648}
    table{width:100%;border-collapse:collapse} th,td{border-bottom:1px solid #ece1d3;padding:8px;text-align:left;font-size:14px}
    .grid2{display:grid;grid-template-columns:1fr;gap:12px;max-width:100%;margin:0 auto}
    #gameCard{margin:0 auto;min-height:720px}
    .hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 12px;justify-content:flex-start}
    .pill{padding:6px 10px;border:1px solid #d8cfc1;border-radius:999px;background:#fffaf3;font-size:13px}
    .bar{width:220px;height:10px;border-radius:999px;background:#ece1d3;overflow:hidden;border:1px solid #d8cfc1}
    .bar>span{display:block;height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#3b82f6)}
    .study-page{grid-column:1 / -1;text-align:center;padding:24px 20px}
    .study-page .study-top{justify-content:center}
    .study-page #studyWord{font-size:48px;font-weight:900;letter-spacing:.5px}
    .study-page #studyIpa{font-size:20px}
    .study-page #studyCn{font-size:20px}
    .study-page #studySplit{font-size:19px}
    .study-page #studyApprox{font-size:19px}
    .study-page .card{max-width:960px;margin:12px auto 0;text-align:left;background:#fffaf6}
    .study-meta-wrap{max-width:980px;margin:8px auto 0;display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:8px 20px;justify-items:center}
    .study-meta-wrap > div{white-space:nowrap}
    #studyQuizWrap{max-width:820px;margin:10px auto 0;padding:10px 12px;border:1px dashed #d8cfc1;border-radius:10px;background:#fffaf8}
    #studyQuizWrap .row{justify-content:center}
    #studyQuizInput::placeholder{color:#c7cdd8;text-align:center}
    #studyQuizInput:focus{color:#6b7280}
    @media (max-width:720px){.study-meta-wrap{grid-template-columns:1fr}}
    #dictCard{text-align:center}
    #dictCard .row{justify-content:center}
    #gameCard{text-align:center}
    #gameCard .row{justify-content:center}
    #gameCard .hud{justify-content:center}
    #gameCard .opts{justify-items:center}
    #gameCard .opt{text-align:center}
    /* 检测卡片内容同步放大 */
    #gameCard .q{font-size:44px}
    #gameCard .pill{font-size:20px;padding:10px 14px}
    #gameCard #meta,#gameCard #feedback{font-size:20px}
    #gameCard .opt{font-size:20px;padding:20px}
    #gameCard .bar{height:18px}
    #spellInput{font-size:34px !important;line-height:1.3;padding:6px 0;text-align:left;border:none !important;border-bottom:4px solid #0f766e !important;border-radius:0 !important;background:transparent !important;outline:none !important;box-shadow:none !important;font-weight:700;width:75%;max-width:420px;min-width:210px}
    #spellInput:focus{border:none !important;border-bottom:4px solid #0ea5a8 !important;box-shadow:none !important}
    #dictInput{text-align:center;caret-color:#0f766e;border:0;border-bottom:4px solid #0f766e;border-radius:0;background:transparent;outline:none}
    #dictInput:focus{border-bottom-color:#0ea5a8;animation:blinkLine .9s infinite}
    @keyframes blinkLine{0%,100%{border-bottom-color:#0f766e}50%{border-bottom-color:#5eead4}}
    .study-page .study-actions{justify-content:center;gap:12px;flex-wrap:wrap}
    @media (max-width:1100px){.settings-form{grid-template-columns:repeat(3,minmax(120px,1fr));}}
    @media (max-width:900px){.grid2{grid-template-columns:1fr;max-width:100%}.settings-form{grid-template-columns:1fr;} .opts{grid-template-columns:repeat(2,minmax(0,1fr));} h1{font-size:26px}}
  </style>
</head>

<div class="wrap">
  <div class="focus-col">
  <div class="card header-card">
    <a class="back-home" href="./v2.html">← 返回首页</a>
    <h1>📘 检测区 2.0</h1>

  </div>

<div class="card settings-card">
  <div class="course-bar">
    <select id="bookSelect" style="display:none"></select>
    <select id="gradeSelect">
      <option value="g1">1年级</option><option value="g2">2年级</option><option value="g3">3年级</option><option value="g4">4年级</option><option value="g5">5年级</option><option value="g6">6年级</option><option value="g7" selected>7年级</option><option value="g8">8年级</option><option value="g9">9年级</option>
        <option value="wy4">外研4</option>
    </select>
    <select id="termSelect"><option value="s">上册</option><option value="x" selected>下册</option></select>
    <select id="unitSelect"><option value="unit1">Unit 1</option></select>
  </div>
  <input id="className" type="hidden"><input id="studentName" type="hidden">
</div>
  <div class="grid2">
  <div class="card" id="gameCard">

    <div class="row" style="margin-bottom:8px;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="muted">检测数量</span>
      <select id="questionCount" style="max-width:130px">
        <option>10</option><option selected>20</option><option>30</option><option value="all">全部</option>
      </select>
      <span class="muted">检测难度</span>
      <select id="difficulty" style="max-width:180px"><option value="easy">简单</option><option value="normal" selected>标准</option><option value="hard">困难</option></select>
      <button class="pri" id="startBtn">开始闯关</button>
    </div>
    <div class="hud">
      <span class="pill" id="stagePill">关卡 Lv.1</span>
      <span class="pill" id="comboPill">连击 x0</span>
      <span class="pill" id="timerPill">⏱️ 30s</span>
      <div class="bar"><span id="progressBar"></span></div>
    </div>
    <div class="row muted" id="meta">第 0/0 题 · 得分 0 · 错题 0</div>
    <div id="question" class="q">请先点击“开始闯关”</div>
    <div id="options" class="opts"></div>
    <div id="spellWrap" class="row" style="display:none;margin-top:5em">
      <span>请输入英文：</span><input id="spellInput" style="min-width:280px" />
    </div>
    <div id="feedback" class="fb"></div>
    <div class="row" style="margin-top:10px">
      <button class="ok" id="submitBtn" disabled>提交</button>
      <button class="pri" id="nextBtn" disabled>下一题</button>
      <button class="ghost" id="speakBtn" disabled>🔊 读单词</button>
      <button class="warn" id="restartBtn" disabled>重开本轮</button>
      <button class="ghost" id="redoWrongBtn" disabled>错题重做</button>
      <button class="ghost" id="downloadWrongBtn" disabled style="display:none">下载错词本</button>
    </div>
  </div>

  <div class="card" id="rankCard" style="display:none">
    <h2>2) 成绩榜</h2>
    <div class="row" style="margin-bottom:8px">
      <button class="ghost" id="refreshRankBtn">刷新</button>
      <button class="warn" id="clearRankBtn">清空成绩榜</button>
    </div>
    <table>
      <thead><tr><th>时间</th><th>班级</th><th>学生</th><th>题库</th><th>得分</th><th>错题</th><th>题量</th></tr></thead>
      <tbody id="rankBody"></tbody>
    </table>
  </div>
  </div>
  </div>

<div class="card study-page" style="display:none"><div id="studyProgress"></div><span id="studyProgressBar"></span><div id="studyWord"></div><div id="studyCn"></div><div id="studyIpa"></div><div id="studySplit"></div><div id="studyApprox"></div><div id="studyQuizWrap"></div><input id="studyQuizInput"><div id="studyCheckFb"></div><div id="studyStatus"></div><span id="studyTargetPill"></span><span id="studyDonePill"></span><span id="studyMasterPill"></span><select id="studyPlan"><option value="all">all</option></select><select id="studyMode"><option value="en2cn">en2cn</option></select><button id="startStudyBtn"></button><button id="speakStudyBtn"></button><button id="speakStudySlowBtn"></button><button id="studyHardBtn"></button><button id="studyFuzzyBtn"></button><button id="studyKnowBtn"></button><button id="prevStudyBtn"></button><button id="nextStudyBtn"></button><button id="speakSplitBtn"></button><button id="studyCheckBtn"></button><button id="studyHintBtn"></button><button id="studyRevealBtn"></button></div>
<div id="dictCard" style="display:none">
    <h2>3) 单词听写</h2>
    <div class="muted" id="dictMeta">未开始</div>
    <div id="dictCn" style="font-size:28px;font-weight:700;margin-top:8px">中文释义：-</div>
    <div class="row" style="margin-top:10px">
      <input id="dictInput" placeholder="请输入英文单词/短语" style="max-width:840px;width:min(90vw,840px);font-size:42px;line-height:1.2;padding:18px 20px;height:140px" />
    </div>
    <div class="row" style="margin-top:8px">
      <button class="ok" id="dictSubmitBtn">提交</button>
      <button class="ghost" id="dictNextBtn">下一个</button>
      <button class="ghost" id="dictSpeakBtn">🔊 发音</button>
      <button class="pri" id="startDictBtn">开始听写</button>
    </div>
    <div class="muted" id="dictFeedback" style="margin-top:8px">-</div>
  </div></div>
<div id="morphCard" style="display:none"><div id="morphMeta"></div><div id="morphWord"></div><div id="morphMeaning"></div><div id="morphBlocks"></div><div id="morphFb"></div><span id="morphScorePill"></span><span id="morphComboPill"></span><span id="morphTimerPill"></span><span id="morphProgressBar"></span><select id="morphBankMode"><option value="unit">unit</option></select><select id="morphCount"><option value="10">10</option></select><button id="startMorphBtn"></button><button id="nextMorphBtn"></button><button id="speakMorphBtn"></button></div>
<div id="pronCard" style="display:none"><button id="startPronBtn"></button><button id="replayPronBtn"></button><button id="nextPronBtn"></button><div id="pronMeta"></div><div id="pronPrompt"></div><div id="pronOptions"></div><div id="pronFb"></div></div>
<div id="speakEvalCard" style="display:none"><button id="startSpeakEvalBtn"></button><button id="retrySpeakEvalBtn"></button><button id="saveSpeakEvalBtn"></button><button id="manualSpeakGoodBtn"></button><button id="manualSpeakMidBtn"></button><button id="manualSpeakBadBtn"></button><div id="speakEvalMeta"></div><div id="speakEvalHeard"></div><div id="speakEvalScore"></div><div id="speakEvalBreakdown"></div><div id="speakEvalStars"></div><div id="speakEvalHistory"></div></div>
<div id="selfImportCard" style="display:none"><input id="newBookName"><button id="addBookBtn"></button><button id="deleteBookBtn"></button><textarea id="importWordsInput"></textarea><button id="importWordsBtn"></button><button id="exportWordsBtn"></button><span id="importStatus"></span><span id="importHint"></span></div>
<div id="bankStat"></div>

</div>

function buildFltrpUnits(grade, term, pool, seed=0){
  const out = {};
  const n = pool.length;
  for(let u=1; u<=10; u++){
    const arr = [];
    for(let i=0; i<8; i++){
      const idx = (seed + (u-1)*8 + i) % n;
      arr.push(pool[idx]);
    }
    out[`g${grade}${term}_u${u}`] = arr;
  }
  return out;
}

function normalizeImportLines(text){
  return String(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map(line=>{
    let parts = line.split(/\t|\s*[,，|｜]\s*|\s{2,}/).map(x=>x.trim()).filter(Boolean);
    if(parts.length<2){
      const m = line.match(/^(.+?)\s+([\u4e00-\u9fa5].+)$/);
      if(m) parts=[m[1].trim(), m[2].trim()];
    }
    if(parts.length<2) return null;
    const en = parts.shift().trim();
    const cn = parts.join('；').trim();
    if(!en || !cn) return null;
    return [en, cn];
  }).filter(Boolean);
}

function splitMorphWord(word){
  const w = String(word||'').toLowerCase();
  const prefixes = ['un','re','dis','im','in','pre','post'];
  const suffixes = ['ing','ed','er','est','ly','ful','less','tion','sion','ment','able','ness'];
  for(const p of prefixes){
    if(w.startsWith(p) && w.length > p.length+2){
      return [p, w.slice(p.length)];
    }
  }
  for(const s of suffixes){
    if(w.endsWith(s) && w.length > s.length+2){
      return [w.slice(0,-s.length), s];
    }
  }
  if(w.length>=6){
    const mid=Math.floor(w.length/2);
    return [w.slice(0,mid), w.slice(mid)];
  }
  return [w];
}

function buildMorphList(){
  const mode = (morphBankMode && morphBankMode.value) || 'unit';
  const grade = gradeSelect.value || 'g7';
  const term = termSelect.value || 's';
  const currentUnit = $("unitSelect").value || selectedUnit || 'unit1';

  let src = [];
  if(mode==='unit'){
    src = getStudyWords(currentUnit);
  }else if(mode==='term'){
    const prefix = `${grade}${term}_u`;
    src = Object.entries(ALL_UNITS)
      .filter(([k]) => k.startsWith(prefix) || (grade==='g7' && ((term==='s' && /^(starter\d+|unit[1-7])$/.test(k)) || (term==='x' && /^unit(8|9|10|11|12|13|14|15)$/.test(k)))))
      .flatMap(([,arr])=>arr||[]);
  }else{
    if(grade==='g7'){
      src = Object.entries(ALL_UNITS).filter(([k])=>/^(starter\d+|unit\d+)$/.test(k)).flatMap(([,arr])=>arr||[]);
    }else{
      const prefix = `${grade}`;
      src = Object.entries(ALL_UNITS).filter(([k])=>k.startsWith(prefix)).flatMap(([,arr])=>arr||[]);
    }
  }

  src = src.filter(x=>x && x[0] && /^[a-zA-Z-]+$/.test(x[0]));
  morphList = src.map(([en,cn])=>({en: String(en).toLowerCase(), cn, parts: splitMorphWord(en)})).filter(x=>x.parts.length>=2);
  morphList = morphList.sort(()=>Math.random()-0.5); // 随机顺序
  const c = (morphCount && morphCount.value) || '10';
  if(c !== 'all') morphList = morphList.slice(0, Number(c)||10);
  morphPool = [...new Set(morphList.flatMap(x=>x.parts))];
}

function phonicsBreak(word){
  const w = String(word||'').toLowerCase().trim();
  if(!w) return '';
  // 简单分段（启发式）
  const chunks = w
    .replace(/tion/g,'-tion')
    .replace(/sion/g,'-sion')
    .replace(/ing/g,'-ing')
    .replace(/th/g,'th-')
    .replace(/sh/g,'sh-')
    .replace(/ch/g,'ch-')
    .replace(/ph/g,'ph-')
    .replace(/ck/g,'-ck')
    .replace(/([aeiou]{2})/g,'-$1-')
    .replace(/([bcdfghjklmnpqrstvwxyz])([aeiou])/g,'$1-$2')
    .replace(/--+/g,'-')
    .replace(/^-|-$|\s+/g,'');
  return chunks;
}

function toIpaLike(word){
  // 教学用近似音标（简化版）
  const one = (w)=>{
    let s = w.toLowerCase();
    s = s.replace(/tion/g,'ʃən').replace(/sion/g,'ʒən').replace(/ing/g,'ɪŋ');
    s = s.replace(/sh/g,'ʃ').replace(/ch/g,'tʃ').replace(/th/g,'θ').replace(/ph/g,'f').replace(/ck/g,'k');
    s = s.replace(/ee|ea/g,'iː').replace(/oo/g,'uː').replace(/ai|ay/g,'eɪ').replace(/oa/g,'oʊ').replace(/ou|ow/g,'aʊ');
    s = s.replace(/er/g,'ɜːr').replace(/ar/g,'ɑːr').replace(/or/g,'ɔːr');
    s = s.replace(/a/g,'æ').replace(/e/g,'e').replace(/i/g,'ɪ').replace(/o/g,'ɒ').replace(/u/g,'ʌ');
    return '/' + s + '/';
  };
  const parts = String(word||'').trim().split(/\s+/).filter(Boolean);
  return parts.map(one).join(' ');
}

function toSplitPron(word){
  const p = phonicsBreak(word);
  if(!p) return '-';
  return p.split('-').filter(Boolean).join(' + ');
}

    dictionary: '迪克-神-瑞',
    schoolbag: '思库尔-拜格',
  };
  const k = String(word||'').toLowerCase().trim();
  if(!k) return '-';
  if(APPROX_MAP[k]) return APPROX_MAP[k];

  const ipa = toIpaLike(k)
    .replace(/[\/]/g,'')
    .replace(/iː/g,'伊').replace(/ɪ/g,'衣').replace(/eɪ/g,'诶').replace(/e/g,'哎')
    .replace(/aʊ/g,'奥').replace(/oʊ/g,'欧').replace(/uː/g,'乌').replace(/ʌ/g,'阿')
    .replace(/æ/g,'啊').replace(/ɒ/g,'奥').replace(/ɜːr/g,'儿').replace(/ɑːr/g,'啊尔').replace(/ɔːr/g,'奥尔')
    .replace(/tʃ/g,'吃').replace(/ʃ/g,'诗').replace(/θ/g,'思').replace(/ŋ/g,'嗯')
    .replace(/ʒ/g,'日').replace(/ə/g,'呃');
  return ipa.replace(/\s+/g,'-').slice(0, 40) || '-';
}

function pickFemaleVoice(lang='en-US'){
  if(!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  const inLang = voices.filter(v => (v.lang||'').toLowerCase().startsWith(lang.toLowerCase().split('-')[0]));
  const pool = inLang.length ? inLang : voices;
  const femaleHints = /(female|woman|girl|zira|samantha|victoria|karen|susan|aria|jenny|ava|emma)/i;
  return pool.find(v=>femaleHints.test(v.name||'')) || pool[0] || null;
}

function textSimScore(a,b){
  const s1=String(a||'').toLowerCase().replace(/[^a-z]/g,'');
  const s2=String(b||'').toLowerCase().replace(/[^a-z]/g,'');
  if(!s1 || !s2) return 0;
  if(s1===s2) return 100;
  const m=s1.length, n=s2.length;
  const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      const c=s1[i-1]===s2[j-1]?0:1;
      dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+c);
    }
  }
  const dist=dp[m][n];
  return Math.max(0, Math.round((1-dist/Math.max(m,n))*100));
}

function runSpeakEval(){
  if(!studyList.length){
    speakEvalMeta.textContent='未开始（请先点开始学习）';
    return;
  }
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Rec){
    speakEvalMeta.textContent='浏览器不支持自动识别，请用“手动评”';
    return;
  }
  const target = String(studyList[studyIdx]?.[0]||'');
  speakEvalMeta.textContent = `评分中：请朗读「${target}」`;
  speakEvalHeard.textContent = '识别结果：...';
  speakEvalScore.textContent = '总分：评分中...';
  speakEvalBreakdown.textContent = '准确度 - ｜ 流利度 - ｜ 完整度 - ｜ 置信度 -';
  speakEvalStars.textContent = '评级：-';

  const rec = new Rec();
  rec.lang='en-US';
  rec.interimResults=false;
  rec.maxAlternatives=1;
  let done=false;
  const timer=setTimeout(()=>{ if(!done){ try{rec.stop();}catch{} speakEvalMeta.textContent='识别超时，请重试或用“手动评”'; } }, 7000);

  rec.onresult=(e)=>{
    done=true; clearTimeout(timer);
    const heard = e.results?.[0]?.[0]?.transcript || '';
    const conf = Math.round((e.results?.[0]?.[0]?.confidence || 0.6)*100);
    const acc = textSimScore(heard, target);
    const targetLen = String(target||'').replace(/[^a-z]/ig,'').length || 1;
    const heardLen = String(heard||'').replace(/[^a-z]/ig,'').length;
    const completeness = Math.max(0, Math.min(100, Math.round((heardLen/targetLen)*100)));
    const fluency = Math.max(40, Math.min(100, Math.round((acc*0.6 + conf*0.4))));
    const total = Math.round(acc*0.55 + fluency*0.2 + completeness*0.15 + conf*0.1);

    speakEvalHeard.textContent = `识别结果：${heard || '-'}`;
    speakEvalScore.textContent = `总分：${total}`;
    speakEvalBreakdown.textContent = `准确度 ${acc} ｜ 流利度 ${fluency} ｜ 完整度 ${completeness} ｜ 置信度 ${conf}`;
    const stars = total>=90?'★★★★★':total>=80?'★★★★☆':total>=70?'★★★☆☆':total>=60?'★★☆☆☆':'★☆☆☆☆';
    speakEvalStars.textContent = `评级：${stars}`;

    if(total>=90) speakEvalMeta.textContent='评价：优秀，可进闯关';
    else if(total>=80) speakEvalMeta.textContent='评价：良好，再稳一点更好';
    else if(total>=65) speakEvalMeta.textContent='评价：及格，建议再跟读1次';
    else speakEvalMeta.textContent='评价：需加强，建议慢速跟读后再测';

    speakEvalLast = {word:target,total,acc,fluency,completeness,conf};
  };
  rec.onerror=(e)=>{ done=true; clearTimeout(timer); speakEvalMeta.textContent = `识别失败：${e.error||'unknown'}，可用“手动评”`; };
  rec.start();
}

function buildModePlan(totalCount){
  if(difficulty==='easy') return Array.from({length: totalCount}, (_,i)=> i%2===0 ? 'cn2en' : 'en2cn');
  if(difficulty==='hard') return Array.from({length: totalCount}, ()=> 'dictation');
  const half = Math.floor(totalCount/2);
  const pickChoices = Array.from({length: half}, (_,i)=> i%2===0 ? 'cn2en' : 'en2cn');
  const spells = Array.from({length: totalCount-half}, ()=> 'spell');
  return shuffle([...pickChoices, ...spells]);
}

function startGame(){
  className = $("className").value.trim() || "未命名班级";
  studentName = $("studentName").value.trim() || "匿名学生";

  selectedUnit = $("unitSelect").value || 'unit1';
  applyUnitBank();

  pool = pick(WORDS, Math.min(total, WORDS.length));
  modePlan = buildModePlan(pool.length);
  idx=0; score=0; wrongItems=[]; started=true;
  combo=0; bestCombo=0; stage=1;
  isRedoMode=false; redoQueue=[]; redoRound=1; redoBasePool=[]; correctCount=0;

}

function showQ(){
  if(idx>=pool.length){
    if(isRedoMode && redoQueue.length){
      pool = [...redoBasePool];
      redoQueue = [];
      idx = 0;
      combo = 0;
      bestCombo = 0;
      redoRound += 1;
      fb.textContent = `🔁 错题重学第${redoRound}轮（全量覆盖 ${pool.length}题）`;
      fb.className = "fb";
    }else{
      return finish();
    }
  }
  current = pool[idx];
  mode = modePlan[idx] || randomMode();
  stage = Math.min(5, Math.floor(idx/5)+1);
  fb.textContent=""; fb.className="fb"; nextBtn.disabled=true; submitBtn.disabled=false;
  spellInput.value=""; opts.innerHTML="";

  const [en,cn] = current;
  if(mode==="cn2en"){
    q.innerHTML = `【中译英】把中文选成英文：<br><b>${cn}</b>`;
    renderChoice(en, WORDS.filter(w=>w[0]!==en).map(w=>w[0]));
  }else if(mode==="en2cn"){
    q.innerHTML = `【英译中】选择英文词义：<br><b>${en}</b>`;
    renderChoice(cn, WORDS.filter(w=>w[1]!==cn).map(w=>w[1]));
  }else if(mode==="dictation"){
    q.innerHTML = `【听音拼写】听读音，按词义+音标写英文：<br><b>${cn}</b><br><span class="muted">音标：${toIpaLike(en)}</span>`;
    spellWrap.style.display="flex"; opts.style.display="none"; spellInput.focus();
  }else{
    q.innerHTML = `【拼写题】根据词义+音标写英文：<br><b>${cn}</b><br><span class="muted">音标：${toIpaLike(en)}</span>`;
    spellWrap.style.display="flex"; opts.style.display="none"; spellInput.focus();
  }
  const baseTimer = difficulty==='easy' ? 35 : (difficulty==='hard' ? 26 : 30);
  const stagePenalty = (mode==='spell' || mode==='dictation') ? Math.max(0, stage-1) : 0;
  timer = Math.max(7, baseTimer - stagePenalty);
  startTimer();
  renderMeta();
  speakCurrentWord();
}

function renderChoice(correct,distr){
  spellWrap.style.display="none"; opts.style.display="grid";

  const options = shuffle([correct,...pick(distr, 3)]);
  options.forEach((t,i)=>{
    const label=document.createElement("label"); label.className="opt";
    label.innerHTML=`<input type="radio" name="opt" value="${escapeHtml(t)}"> <b>${letters[i]}.</b> ${escapeHtml(t)}`;
    opts.appendChild(label);
  });
}

function randomMode(){
  // 简单：全选择题；标准：选择题/拼写各一半；困难：全听音拼写
  if(difficulty==='easy') return Math.random()<0.5?"cn2en":"en2cn";
  if(difficulty==='hard') return "dictation";
  return Math.random()<0.5?(Math.random()<0.5?"cn2en":"en2cn"):"spell";
}

function submit(){
  if(!started) return;
  stopTimer();
  const [en,cn] = current;
  let your="", correct="", right=false;
  if(mode==="spell" || mode==="dictation"){
    your=spellInput.value.trim(); if(!your) return alert("请输入答案");
    correct=en; right=your.toLowerCase()===correct.toLowerCase();
  }else{
    const picked=document.querySelector('input[name="opt"]:checked'); if(!picked) return alert("请选择答案");
    your=picked.value; correct=(mode==="cn2en"?en:cn); right=(your===correct);
  }

  if(right){
    combo += 1;
    bestCombo = Math.max(bestCombo, combo);
    correctCount += 1;
    score = Math.round((correctCount / Math.max(1, pool.length)) * 100);
    fb.textContent=`✅ 正确（当前 ${score} 分）`;
    fb.className="fb good";
    playSfx('ok');

    submitBtn.disabled=true;
    nextBtn.disabled=true;
    renderMeta();

    setTimeout(()=>{
      if(idx < pool.length){
        nextQ();
      }
    }, 450);
    return;
  }
  else {
    combo = 0;
    score = Math.round((correctCount / Math.max(1, pool.length)) * 100);
    wrongItems.push({mode,en,cn,your,correct});
    fb.textContent=`❌ 正确答案：${correct}`;
    fb.className="fb bad";
    playSfx('bad');
  }

  submitBtn.disabled=true; nextBtn.disabled=false; renderMeta();
}

function nextQ(){ idx++; showQ(); }
function restartRound(){ if(!started) return; idx=0; score=0; wrongItems=[]; combo=0; bestCombo=0; stage=1; correctCount=0; isRedoMode=false; pool=pick(WORDS, Math.min(total, WORDS.length)); modePlan=buildModePlan(pool.length); showQ(); }

function redoWrong(){
  if(!wrongItems.length) return alert("当前没有错题可重做");
  const uniq = [];
  const seen = new Set();
  wrongItems.forEach(w=>{
    const k = `${w.en}|||${w.cn}`;
    if(!seen.has(k)){ seen.add(k); uniq.push([w.en, w.cn]); }
  });
  pool = uniq;
  modePlan = buildModePlan(pool.length);
  idx = 0;
  combo = 0;
  bestCombo = 0;
  correctCount = 0;
  score = 0;
  isRedoMode = true;
  redoQueue = [];
  redoRound = 1;
  redoBasePool = [...uniq];
  fb.textContent = "🧠 已进入错题重做模式（第1轮）";
  fb.className = "fb";
  showQ();
}

function startTimer(){
  stopTimer();
  timerPill.textContent = `⏱️ ${timer}s`;
  timerId = setInterval(()=>{
    timer -= 1;
    timerPill.textContent = `⏱️ ${timer}s`;
    if(timer<=0){
      stopTimer();
      if(!submitBtn.disabled){
        combo = 0;
        score = Math.round((correctCount / Math.max(1, pool.length)) * 100);
        wrongItems.push({mode, en: current?.[0]||"", cn: current?.[1]||"", your: "超时", correct: mode==="cn2en"?(current?.[0]||""):(mode==="en2cn"?(current?.[1]||""):(current?.[0]||""))});
        fb.textContent = "⏰ 超时，本题判错";
        fb.className = "fb bad";
        playSfx('bad');
        submitBtn.disabled = true;
        nextBtn.disabled = false;
        renderMeta();
      }
    }
  },1000);
}

function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

function speakCurrentWord(){

  if(!current || !("speechSynthesis" in window)) return;
  const [en] = current;
  const text = String(en || "").trim();
  if(!text) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-US";
  utter.rate = 0.9;
  utter.pitch = 1.1;
  const v = pickFemaleVoice('en-US');
  if(v) utter.voice = v;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

function playSfx(type='ok'){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ac = new AC();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sine';
    if(type==='ok'){
      osc.frequency.setValueAtTime(660, ac.currentTime);
      osc.frequency.linearRampToValueAtTime(880, ac.currentTime + 0.12);
    }else{
      osc.frequency.setValueAtTime(300, ac.currentTime);
      osc.frequency.linearRampToValueAtTime(180, ac.currentTime + 0.12);
    }
    gain.gain.setValueAtTime(0.0001, ac.currentTime);
    gain.gain.linearRampToValueAtTime(0.12, ac.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.16);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start();
    osc.stop(ac.currentTime + 0.18);
  }catch(e){}
}

function renderMeta(){
  meta.textContent=`第 ${Math.min(idx+1,pool.length)}/${pool.length} 题 · 得分 ${score} · 错题 ${wrongItems.length} · ${className} / ${studentName} · ${selectedUnit.toUpperCase()} · 难度 ${difficulty}${isRedoMode?` · 错题重做·第${redoRound}轮`:''}`;
  stagePill.textContent = `关卡 Lv.${stage}`;
  comboPill.textContent = `连击 x${combo}`;
  const pct = pool.length ? Math.round((idx / pool.length) * 100) : 0;
  progressBar.style.width = `${pct}%`;
}

function finish(){
  stopTimer();
  score = Math.round((correctCount / Math.max(1, pool.length)) * 100);
  let level="💪 再练一轮会更稳";
  if(score>=90) level="🏆 优秀";
  else if(score>=75) level="🌟 良好";
  else if(score>=60) level="✅ 及格";

  const medals = [];
  if(bestCombo>=8) medals.push('🔥 连击王');
  if(wrongItems.length<=2) medals.push('🛡️ 稳定输出');
  if(difficulty==='hard' && score>=85) medals.push('👑 困难征服者');
  if(isRedoMode && wrongItems.length===0) medals.push('🧠 纠错达人');

  q.innerHTML=`🎉 本轮完成<br><b>总分：${score}分（百分制）</b> · ${level}<br>🔥 最高连击：x${bestCombo}<br>${medals.length?('🏅 勋章：'+medals.join(' / ')):'🏅 勋章：继续挑战'}`;
  opts.innerHTML=""; spellWrap.style.display="none"; fb.textContent=`错题数：${wrongItems.length}`;
  submitBtn.disabled=true; nextBtn.disabled=true; speakBtn.disabled=true;
  progressBar.style.width = `100%`;
  playSfx('ok');
  saveRank(); renderRank();
}

function downloadWrong(){
  if(!wrongItems.length) return alert("当前没有错题可导出");
  const lines=[];
  lines.push(`班级：${className}  学生：${studentName}  时间：${new Date().toLocaleString()}`);
  lines.push("=".repeat(60));
  wrongItems.forEach((w,i)=>{ lines.push(`${i+1}. ${w.mode} | ${w.en} | ${w.cn}`); lines.push(`   你的答案: ${w.your}`); lines.push(`   正确答案: ${w.correct}`); lines.push(""); });
  const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`${className}_${studentName}_unit1_wrong_words.txt`; a.click(); URL.revokeObjectURL(a.href);
}

function saveRank(){
  const key="unit1_rank_v1";
  const old=JSON.parse(localStorage.getItem(key)||"[]");
  old.unshift({time:new Date().toLocaleString(), className, studentName, unit:selectedUnit, score, wrong:wrongItems.length, total:pool.length});
  localStorage.setItem(key, JSON.stringify(old.slice(0,200)));
}

function renderRank(){
  const body=$("rankBody"), key="unit1_rank_v1"; body.innerHTML="";
  const rows=JSON.parse(localStorage.getItem(key)||"[]");
  rows.forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${r.time}</td><td>${escapeHtml(r.className)}</td><td>${escapeHtml(r.studentName)}</td><td>${escapeHtml((r.unit||'unit1').toUpperCase())}</td><td>${r.score}</td><td>${r.wrong}</td><td>${r.total}</td>`;
    body.appendChild(tr);
  });
}

function clearRank(){ if(confirm("确认清空成绩榜？")){ localStorage.removeItem("unit1_rank_v1"); renderRank(); } }

function resetBank(){ selectedUnit = $("unitSelect").value || 'unit1'; applyUnitBank(); alert(`已按当前选择加载词表：${selectedUnit.toUpperCase()}`); }

function addCustomBook(){
  const name = String(newBookName.value||'').trim();
  if(!name) return alert('先输入书本名称');
  const id = `b${Date.now().toString(36)}`;
  CUSTOM_BOOKS[id] = { id, name, terms:{ s:{}, x:{} } };
  saveCustomBooks();
  renderBookOptions();
  bookSelect.value = `custom:${id}`;
  renderUnitOptions();
  importStatus.textContent = `已新增书本：${name}`;
  newBookName.value = '';
}
function deleteCurrentBook(){
  const book = getSelectedCustomBook();
  if(!book) return alert('当前不是自定义书本');
  if(!confirm(`确认删除书本：${book.name}？`)) return;
  delete CUSTOM_BOOKS[book.id];
  saveCustomBooks();
  renderBookOptions();
  renderUnitOptions();
  importStatus.textContent = '已删除当前自定义书本';
}
function importCurrentUnit(){
  const pairs = normalizeImportLines(importWordsInput.value);
  if(!pairs.length) return alert('请先粘贴单词，格式：英文,中文');
  const term = termSelect.value || 'x';
  const u = getCurrentTermUnitNumber();
  if(bookSelect.value !== 'builtin'){
    const book = getSelectedCustomBook();
    if(!book) return alert('请先选择或新增自定义书本');
    if(!book.terms) book.terms = {s:{},x:{}};
    if(!book.terms[term]) book.terms[term] = {};
    book.terms[term][`u${u}`] = pairs;
    CUSTOM_BOOKS[book.id] = book;
    saveCustomBooks();
    renderUnitOptions();
    unitSelect.value = customUnitKey(book.id, term, u);
  }else{
    const key = unitSelect.value || selectedUnit || 'unit1';
    CUSTOM_OVERRIDES[key] = pairs;
    saveCustomOverrides();
  }
  selectedUnit = unitSelect.value || selectedUnit || 'unit1';
  startStudy(); startDict(); applyUnitBank();
  importStatus.textContent = `已导入 ${pairs.length} 条到当前单元`;
}
function exportCurrentUnit(){
  const rows = getStudyWords(unitSelect.value || selectedUnit || 'unit1');
  importWordsInput.value = rows.map(([en,cn])=>`${en},${cn}`).join('\n');
  importStatus.textContent = `已导出 ${rows.length} 条`;
}

function escapeHtml(s){ return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
